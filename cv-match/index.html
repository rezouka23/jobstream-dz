<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobStream DZ | Matching CV</title>
    <meta name="description" content="Importez votre CV et trouvez les offres JobStream DZ les plus pertinentes des 7 derniers jours." />
    <link rel="icon" type="image/png" href="/landing/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/landing/styles.css" />
    <link rel="stylesheet" href="styles.css?v=20260606-score-ring" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-paper-plane" viewBox="0 0 24 24">
        <path d="M21.5 2.5L10.7 13.3" />
        <path d="M21.5 2.5L14.5 21.5L10.7 13.3L2.5 9.5L21.5 2.5Z" />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M4 7H20" />
        <path d="M4 12H20" />
        <path d="M4 17H20" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6L18 18" />
        <path d="M6 18L18 6" />
      </symbol>
      <symbol id="icon-upload" viewBox="0 0 24 24">
        <path d="M12 15V4" />
        <path d="M7 9L12 4L17 9" />
        <path d="M4.5 15.5V19.5H19.5V15.5" />
      </symbol>
      <symbol id="icon-spark" viewBox="0 0 24 24">
        <path d="M12 2.8L14.4 9.2L21.2 12L14.4 14.8L12 21.2L9.6 14.8L2.8 12L9.6 9.2L12 2.8Z" />
      </symbol>
      <symbol id="icon-briefcase" viewBox="0 0 24 24">
        <rect x="3.5" y="7.5" width="17" height="12" rx="2" />
        <path d="M8.5 7.5V6.5C8.5 5.4 9.4 4.5 10.5 4.5H13.5C14.6 4.5 15.5 5.4 15.5 6.5V7.5" />
        <path d="M3.5 12.5H20.5" />
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="M9 6L15 12L9 18" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="4" />
        <path d="M4.5 20C4.5 16.4 7.9 14 12 14C16.1 14 19.5 16.4 19.5 20" />
      </symbol>
      <symbol id="icon-bookmark" viewBox="0 0 24 24">
        <path d="M6.5 3.5H17.5V20.5L12 16.2L6.5 20.5V3.5Z" />
      </symbol>
    </svg>

    <div class="page-wrap cv-page-wrap">
      <header class="topbar">
        <a href="/landing/" class="brand" aria-label="JobStream DZ">
          <img src="/landing/assets/logo.png" alt="JobStream DZ" />
        </a>

        <div class="site-menu" id="site-menu">
          <nav class="main-nav" aria-label="Main navigation" data-i18n-aria-label="a11y.nav">
            <a href="/landing/" data-i18n="nav.home"></a>
            <a href="/cv-match/" class="is-current" aria-current="page" data-i18n="nav.cvMatch"></a>
            <a href="/landing/#live-feed" data-i18n="nav.feed"></a>
            <a href="/landing/#faq" data-i18n="nav.faq"></a>
          </nav>

          <div class="lang-switch" role="group" aria-label="Language switcher" data-i18n-aria-label="a11y.langSwitch">
            <button type="button" data-lang="fr" class="lang-btn is-active">FR</button>
            <button type="button" data-lang="en" class="lang-btn">EN</button>
            <button type="button" data-lang="ar" class="lang-btn">AR</button>
          </div>
        </div>

        <div class="topbar-actions">
          <a href="/landing/#live-feed" class="join-btn">
            <svg class="icon plane" aria-hidden="true"><use href="#icon-paper-plane"></use></svg>
            <span data-i18n="nav.join"></span>
          </a>

          <button type="button" class="nav-toggle" aria-controls="site-menu" aria-expanded="false" aria-label="Menu" data-i18n-aria-label="a11y.menu">
            <svg class="icon nav-toggle-icon nav-toggle-icon-open" aria-hidden="true"><use href="#icon-menu"></use></svg>
            <svg class="icon nav-toggle-icon nav-toggle-icon-close" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
      </header>

      <main class="cv-main">
        <section class="cv-hero" aria-labelledby="cv-title">
          <div class="cv-hero-copy">
            <p class="cv-kicker"><svg class="icon" aria-hidden="true"><use href="#icon-spark"></use></svg><span data-i18n="cv.kicker"></span></p>
            <h1 id="cv-title" data-i18n-html="cv.title"></h1>
            <p class="cv-subtitle" data-i18n="cv.subtitle"></p>
            <div class="cv-hero-links">
              <a href="/landing/#live-feed" class="cv-text-link" data-i18n="cv.feedLink"></a>
            </div>
          </div>

          <form class="cv-upload-card" data-cv-form>
            <label class="cv-dropzone" for="cv-file">
              <span class="cv-upload-icon"><svg class="icon" aria-hidden="true"><use href="#icon-upload"></use></svg></span>
              <strong data-i18n="cv.uploadTitle"></strong>
              <span data-i18n="cv.uploadHint"></span>
              <input id="cv-file" name="cv" type="file" accept=".pdf,.docx,.txt" data-cv-file required />
            </label>
            <p class="cv-file-name" data-cv-file-name data-i18n="cv.noFile"></p>
            <button type="submit" class="cv-submit">
              <span data-submit-label data-i18n="cv.submit"></span>
              <svg class="icon" aria-hidden="true"><use href="#icon-chevron-right"></use></svg>
            </button>
            <p class="cv-privacy" data-i18n="cv.privacy"></p>
            <p class="cv-status" data-cv-status role="status" aria-live="polite"></p>
          </form>
        </section>

        <section class="cv-results-panel" data-results-panel hidden aria-labelledby="cv-results-title">
          <div class="cv-results-head">
            <div>
              <p class="cv-kicker"><svg class="icon" aria-hidden="true"><use href="#icon-briefcase"></use></svg><span data-i18n="results.kicker"></span></p>
              <h2 id="cv-results-title" data-i18n="results.title"></h2>
              <p data-results-meta></p>
            </div>
            <button type="button" class="cv-reset" data-cv-reset data-i18n="results.reset"></button>
          </div>

          <div class="cv-summary" data-candidate-summary></div>
          <div class="cv-matches" data-matches></div>
        </section>
      </main>
    </div>

    <script src="script.js?v=20260606-score-ring"></script>
  </body>
</html>
