<!doctype html>
<html lang="fr" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobStream DZ | Offres du jour</title>
    <meta
      name="description"
      content="Consultez les offres ajoutées aujourd'hui sur JobStream DZ, directement depuis la feuille Google Sheets principale."
    />
    <link rel="icon" type="image/png" href="/landing/assets/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/landing/styles.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <symbol id="icon-paper-plane" viewBox="0 0 24 24">
        <path d="M21.5 2.5L10.7 13.3" />
        <path d="M21.5 2.5L14.5 21.5L10.7 13.3L2.5 9.5L21.5 2.5Z" />
      </symbol>
      <symbol id="icon-briefcase" viewBox="0 0 24 24">
        <rect x="3.5" y="7.5" width="17" height="12" rx="2" />
        <path d="M8.5 7.5V6.5C8.5 5.4 9.4 4.5 10.5 4.5H13.5C14.6 4.5 15.5 5.4 15.5 6.5V7.5" />
        <path d="M3.5 12.5H20.5" />
      </symbol>
      <symbol id="icon-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7.5V12L15.5 14" />
      </symbol>
      <symbol id="icon-chevron-right" viewBox="0 0 24 24">
        <path d="M9 6L15 12L9 18" />
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24">
        <path d="M4 7H20" />
        <path d="M4 12H20" />
        <path d="M4 17H20" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path d="M6 6L18 18" />
        <path d="M6 18L18 6" />
      </symbol>
      <symbol id="icon-calendar" viewBox="0 0 24 24">
        <rect x="3.5" y="5" width="17" height="15.5" rx="2" />
        <path d="M3.5 9.5H20.5" />
        <path d="M8 3.5V6.5" />
        <path d="M16 3.5V6.5" />
      </symbol>
      <symbol id="icon-broadcast" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2" />
        <path d="M7.8 7.8C5.5 10.1 5.5 13.9 7.8 16.2" />
        <path d="M16.2 7.8C18.5 10.1 18.5 13.9 16.2 16.2" />
        <path d="M5 5C1.9 8.1 1.9 15.9 5 19" />
        <path d="M19 5C22.1 8.1 22.1 15.9 19 19" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.5" />
        <path d="M15.8 15.8L20.5 20.5" />
      </symbol>
      <symbol id="icon-globe" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M3.5 12H20.5" />
        <path d="M12 3.5C14.5 6 14.5 18 12 20.5C9.5 18 9.5 6 12 3.5Z" />
      </symbol>
      <symbol id="icon-map-pin" viewBox="0 0 24 24">
        <path d="M12 21S5.5 14.8 5.5 10.2C5.5 6.7 8.4 4 12 4C15.6 4 18.5 6.7 18.5 10.2C18.5 14.8 12 21 12 21Z" />
        <circle cx="12" cy="10.2" r="2.4" />
      </symbol>
      <symbol id="icon-bookmark" viewBox="0 0 24 24">
        <path d="M6.5 4.5H17.5V20L12 16.2L6.5 20V4.5Z" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path d="M5 7H19" />
        <path d="M9.5 7V5.5C9.5 4.7 10.2 4 11 4H13C13.8 4 14.5 4.7 14.5 5.5V7" />
        <path d="M6.5 7L7.3 19C7.4 19.8 8 20.5 8.8 20.5H15.2C16 20.5 16.6 19.8 16.7 19L17.5 7" />
      </symbol>
      <symbol id="icon-list" viewBox="0 0 24 24">
        <path d="M8 7H20" />
        <path d="M8 12H20" />
        <path d="M8 17H20" />
        <path d="M4 7H4.01" />
        <path d="M4 12H4.01" />
        <path d="M4 17H4.01" />
      </symbol>
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <rect x="4" y="4" width="7" height="7" rx="1.3" />
        <rect x="13" y="4" width="7" height="7" rx="1.3" />
        <rect x="4" y="13" width="7" height="7" rx="1.3" />
        <rect x="13" y="13" width="7" height="7" rx="1.3" />
      </symbol>
      <symbol id="icon-building" viewBox="0 0 24 24">
        <rect x="5" y="3.5" width="14" height="17" rx="1.6" />
        <path d="M9 7.5H11" />
        <path d="M13 7.5H15" />
        <path d="M9 11H11" />
        <path d="M13 11H15" />
        <path d="M10 20.5V16.5H14V20.5" />
      </symbol>
      <symbol id="icon-arrow-right" viewBox="0 0 24 24">
        <path d="M4 12H20" />
        <path d="M14 6L20 12L14 18" />
      </symbol>
      <symbol id="icon-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" />
        <path d="M12 11V16" />
        <path d="M12 7.8H12.01" />
      </symbol>
    </svg>

    <div class="page-wrap jobs-page-wrap">
      <header class="topbar">
        <a href="/landing/" class="brand" aria-label="JobStream DZ">
          <img src="/landing/assets/logo.png" alt="JobStream DZ" />
        </a>

        <div class="site-menu" id="site-menu">
          <nav class="main-nav" aria-label="Main navigation" data-i18n-aria-label="a11y.nav">
            <a href="/landing/" data-i18n="nav.home"></a>
            <a href="/jobs-today/" class="is-current" aria-current="page" data-i18n="nav.jobsToday"></a>
            <a href="/cv-match/" data-i18n="nav.cvMatch"></a>
            <a href="/landing/#proof" data-i18n="nav.proof"></a>
            <a href="/landing/#live-feed" data-i18n="nav.feed"></a>
            <a href="/landing/#story" data-i18n="nav.story"></a>
            <a href="/landing/#faq" data-i18n="nav.faq"></a>
          </nav>

          <div class="lang-switch" role="group" aria-label="Language switcher" data-i18n-aria-label="a11y.langSwitch">
            <button type="button" data-lang="fr" class="lang-btn is-active">FR</button>
            <button type="button" data-lang="en" class="lang-btn">EN</button>
            <button type="button" data-lang="ar" class="lang-btn">AR</button>
          </div>
        </div>

        <div class="topbar-actions">
          <a href="https://t.me/jobstream_dz" target="_blank" rel="noreferrer" class="join-btn">
            <svg class="icon plane" aria-hidden="true"><use href="#icon-paper-plane"></use></svg>
            <span data-i18n="nav.join"></span>
          </a>

          <button
            type="button"
            class="nav-toggle"
            aria-controls="site-menu"
            aria-expanded="false"
            aria-label="Menu"
            data-i18n-aria-label="a11y.menu"
          >
            <svg class="icon nav-toggle-icon nav-toggle-icon-open" aria-hidden="true"><use href="#icon-menu"></use></svg>
            <svg class="icon nav-toggle-icon nav-toggle-icon-close" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </div>
      </header>

      <main class="jt-main">
        <section class="jt-hero" aria-labelledby="jobs-today-title">
          <div class="jt-hero-copy">
            <h1 id="jobs-today-title" data-i18n-html="today.title"></h1>
            <p class="jt-hero-live">
              <span class="jt-live-dot" aria-hidden="true"></span>
              <span class="jt-live-label" data-i18n="today.dash.liveFeed"></span>
              <span class="jt-hero-tagline" data-i18n="today.dash.heroTagline"></span>
            </p>

            <div class="jt-stats" aria-live="polite">
              <article class="jt-stat">
                <span class="jt-stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-briefcase"></use></svg></span>
                <span class="jt-stat-value" data-jobs-total>10</span>
                <p class="jt-stat-label" data-jobs-total-label data-i18n="today.stats.total"></p>
                <p class="jt-stat-sub" data-stat-total-sub data-i18n="today.dash.statTotalSub"></p>
              </article>
              <article class="jt-stat">
                <span class="jt-stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-calendar"></use></svg></span>
                <span class="jt-stat-value" data-jobs-date>--</span>
                <p class="jt-stat-label" data-i18n="today.stats.date"></p>
                <p class="jt-stat-sub" data-i18n="today.dash.statDateSub"></p>
              </article>
              <article class="jt-stat">
                <span class="jt-stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-clock"></use></svg></span>
                <span class="jt-stat-value" data-jobs-refreshed>--</span>
                <p class="jt-stat-label" data-i18n="today.stats.refreshed"></p>
                <p class="jt-stat-sub" data-stat-refreshed-sub></p>
              </article>
              <article class="jt-stat">
                <span class="jt-stat-icon" aria-hidden="true"><svg class="icon"><use href="#icon-broadcast"></use></svg></span>
                <span class="jt-stat-value" data-jobs-sources>8</span>
                <p class="jt-stat-label" data-i18n="today.dash.statSources"></p>
                <p class="jt-stat-sub" data-i18n="today.dash.statSourcesSub"></p>
              </article>
            </div>
          </div>
          <div class="jt-hero-visual" aria-hidden="true"><span class="jt-radar"></span></div>
        </section>

        <div class="jt-dashboard">
          <aside class="jt-sidebar" aria-label="Filters">
            <div class="jt-sidebar-head">
              <span class="jt-panel-icon" aria-hidden="true"><svg class="icon"><use href="#icon-funnel"></use></svg></span>
              <h2 class="jt-panel-title" data-i18n="today.dash.filterTitle"></h2>
              <button type="button" class="jt-clear-all" data-today-clear hidden data-i18n="today.dash.clearAll"></button>
            </div>

            <div class="jt-search">
              <span class="jt-search-icon" aria-hidden="true"><svg class="icon"><use href="#icon-search"></use></svg></span>
              <input
                type="search"
                class="jt-search-input"
                data-today-search
                autocomplete="off"
                data-i18n-placeholder="today.filters.searchPlaceholder"
                data-i18n-aria-label="today.filters.searchLabel"
              />
            </div>

            <div class="jt-facet">
              <p class="jt-facet-label">
                <span data-i18n="today.dash.sourcesLabel"></span>
                <span class="jt-facet-info" aria-hidden="true"><svg class="icon"><use href="#icon-info"></use></svg></span>
              </p>
              <div class="jt-chips" role="group" data-today-source-chips></div>
            </div>

            <div class="jt-facet" data-today-location-group hidden>
              <p class="jt-facet-label">
                <span data-i18n="today.filters.locationLabel"></span>
                <span class="jt-facet-info" aria-hidden="true"><svg class="icon"><use href="#icon-info"></use></svg></span>
              </p>
              <div class="jt-select-wrap">
                <span class="jt-select-icon" aria-hidden="true"><svg class="icon"><use href="#icon-globe"></use></svg></span>
                <select class="jt-select" data-today-location-select data-i18n-aria-label="today.filters.locationLabel"></select>
                <span class="jt-select-chevron" aria-hidden="true"><svg class="icon"><use href="#icon-chevron-right"></use></svg></span>
              </div>
              <div class="jt-chips" role="group" data-today-location-chips></div>
              <button type="button" class="jt-location-toggle" data-today-location-toggle hidden></button>
            </div>

            <div class="jt-facet">
              <p class="jt-facet-label">
                <span data-i18n="today.dash.recencyLabel"></span>
                <span class="jt-facet-info" aria-hidden="true"><svg class="icon"><use href="#icon-info"></use></svg></span>
              </p>
              <div class="jt-chips" role="group" data-today-recency-chips>
                <button type="button" class="jt-chip is-active" data-facet="recency" data-value="" aria-pressed="true" data-i18n="today.dash.recencyAll"></button>
                <button type="button" class="jt-chip" data-facet="recency" data-value="1" aria-pressed="false" data-i18n="today.dash.recency24"></button>
                <button type="button" class="jt-chip" data-facet="recency" data-value="3" aria-pressed="false" data-i18n="today.dash.recency3"></button>
                <button type="button" class="jt-chip" data-facet="recency" data-value="7" aria-pressed="false" data-i18n="today.dash.recency7"></button>
              </div>
            </div>

            <button type="button" class="jt-clear-btn" data-today-clear-btn>
              <svg class="icon" aria-hidden="true"><use href="#icon-trash"></use></svg>
              <span data-i18n="today.filters.clear"></span>
            </button>
          </aside>

          <section class="jt-results" aria-labelledby="jobs-list-title">
            <div class="jt-results-head">
              <div class="jt-results-status">
                <span class="jt-live-dot" aria-hidden="true"></span>
                <strong data-today-count></strong>
                <span class="jt-results-updated" data-today-status aria-live="polite" aria-atomic="true"></span>
              </div>
              <div class="jt-results-controls">
                <label class="jt-sort">
                  <span class="jt-sort-label" data-i18n="today.dash.sortBy"></span>
                  <select class="jt-select jt-sort-select" data-today-sort data-i18n-aria-label="today.dash.sortBy">
                    <option value="newest" data-i18n="today.dash.sortNewest"></option>
                    <option value="oldest" data-i18n="today.dash.sortOldest"></option>
                  </select>
                </label>
                <div class="jt-view-toggle" role="group" data-i18n-aria-label="today.dash.viewLabel">
                  <button type="button" class="jt-view-btn is-active" data-view="grid" aria-pressed="true" data-i18n-aria-label="today.dash.gridView">
                    <svg class="icon" aria-hidden="true"><use href="#icon-grid"></use></svg>
                  </button>
                  <button type="button" class="jt-view-btn" data-view="list" aria-pressed="false" data-i18n-aria-label="today.dash.listView">
                    <svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>
                  </button>
                </div>
              </div>
            </div>

            <h2 id="jobs-list-title" class="sr-only" data-i18n="today.listTitle"></h2>
            <div class="jt-grid" data-view="grid" data-today-list aria-busy="true"></div>

            <nav class="jt-pagination" data-today-pagination aria-label="Pagination" data-i18n-aria-label="today.pagination.nav" hidden></nav>

            <p class="jt-end" data-today-end hidden>
              <span class="jt-end-ring" aria-hidden="true"></span>
              <span data-i18n="today.dash.endOfFeed"></span>
            </p>

            <a href="https://t.me/jobstream_dz" target="_blank" rel="noreferrer" class="jt-telegram">
              <svg class="icon" aria-hidden="true"><use href="#icon-paper-plane"></use></svg>
              <span data-i18n="today.telegram"></span>
              <svg class="icon jt-telegram-arrow" aria-hidden="true"><use href="#icon-arrow-right"></use></svg>
            </a>
          </section>
        </div>
      </main>
    </div>

    <script src="script.js?v=20260605-recency-fetch"></script>
  </body>
</html>
